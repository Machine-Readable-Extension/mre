sonar.projectKey=Machine-Readable-Extension_mre
sonar.organization=machine-readable-extension

sonar.sources=mre
sonar.tests=mre/tests
# sonar.exclusions prunes the *sources* set only (sonar.tests is a separate,
# independent set) -- without this, mre/tests is claimed by both sonar.sources
# (recursively, as a subdir of mre) and sonar.tests, and the scanner fails
# with "can't be indexed twice".
sonar.exclusions=mre/tests/**

sonar.python.coverage.reportPaths=coverage.xml
